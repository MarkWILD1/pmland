<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan Maestro — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2d2621;
      --sidebar: #312b26;
      --card: #3a322c;
      --inset: #2d2621;
      --ink: #f6f1e9;
      --heading: #f6f1e9;
      --secondary: #bfb6aa;
      --muted: #968a7d;
      --line: #4a4039;
      --hover: #4a4039;
      --gold: #d4a574;
      --gold-hover: #c39462;
      --sand: #e5b882;
      --olive: #767e6b;
      --terra: #cb6149;
      --ink-on-gold: #2d2621;
      --chip: #322c27;
      --banner: #322c27;
      --shadow: rgba(0, 0, 0, 0.22);
      --focus: rgba(212, 165, 116, 0.35);
      --row-hover: rgba(74, 64, 57, 0.55);
    }

    html[data-theme="light"] {
      --bg: #f6f0e9;
      --sidebar: #faf6f2;
      --card: #faf6f2;
      --inset: #ede9de;
      --ink: #2b221c;
      --heading: #2b221c;
      --secondary: #5c5047;
      --muted: #85776c;
      --line: #e7dacd;
      --hover: #eae2d8;
      --gold: #545e46;
      --gold-hover: #475237;
      --sand: #55463b;
      --olive: #767e6b;
      --ink-on-gold: #f6f0e9;
      --chip: #f6f0e9;
      --banner: #eae2d8;
      --shadow: rgba(43, 34, 28, 0.08);
      --focus: rgba(84, 94, 70, 0.28);
      --row-hover: #eae2d8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Geist, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .ico {
      width: 16px;
      height: 16px;
      flex: none;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      height: 100%;
      min-height: 100%;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      box-shadow: inset -2px 0 0 var(--gold);
    }
    .side-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 12px 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-right: auto;
      color: var(--heading);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--gold);
      display: grid;
      place-items: center;
      flex: none;
    }
    .brand-mark span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-on-gold);
      box-shadow: 6px -2px 0 -2px var(--sand);
    }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
    }
    .icon-btn:hover { background: var(--hover); color: var(--ink); }

    .nav {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 6px 10px 12px;
    }
    .nav-item, .row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--secondary);
      text-align: left;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13.5px;
    }
    .nav-item:hover, .row:hover { background: var(--row-hover); color: var(--ink); }
    .nav-item.active {
      background: var(--hover);
      color: var(--ink);
      font-weight: 600;
    }
    .section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 8px 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .section button {
      border: 0;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
    }
    .section button:hover { background: var(--hover); color: var(--ink); }
    .row { padding-top: 6px; padding-bottom: 6px; }
    .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { margin-left: auto; font-size: 12px; font-style: normal; color: var(--muted); }

    .side-foot {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px;
      border-top: 1px solid var(--line);
    }
    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-right: auto;
      padding: 4px 6px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--secondary);
    }
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%, var(--sand), transparent 42%),
        linear-gradient(145deg, var(--gold), var(--olive) 58%, var(--ink-on-gold));
    }
    .theme-btn[aria-pressed="true"] {
      background: var(--hover);
      color: var(--sand);
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 28px 32px 22px;
      background: var(--bg);
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      min-height: 0;
    }
    .hero { text-align: center; }
    .orb-mount {
      width: 96px;
      height: 96px;
      margin: 0 auto 8px;
      display: grid;
      place-items: center;
    }
    .orb-mount canvas { display: block; }
    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 3vw, 40px);
      letter-spacing: -0.03em;
      color: var(--heading);
    }

    .composer {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px 12px;
      box-shadow: 0 16px 40px var(--shadow);
    }
    .composer label {
      display: block;
      margin: 0 4px 8px;
      font-size: 13px;
      color: var(--secondary);
    }
    .select, .composer textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--inset);
      color: var(--ink);
    }
    .select {
      appearance: none;
      padding: 10px 36px 10px 12px;
      font-size: 14px;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 55%, calc(100% - 12px) 55%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }
    .composer textarea {
      display: block;
      margin-top: 10px;
      min-height: 92px;
      resize: vertical;
      padding: 12px;
      outline: none;
    }
    .composer textarea::placeholder { color: var(--muted); }
    .composer textarea:focus, .select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--focus);
      outline: none;
    }
    .composer-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .ghost, .chip, .send, .mic {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--secondary);
    }
    .ghost { padding: 6px 10px; font-size: 12.5px; }
    .ghost:hover, .chip:hover {
      border-color: var(--gold);
      color: var(--ink);
    }
    .push { margin-left: auto; display: flex; gap: 8px; }
    .mic, .send {
      width: 34px;
      height: 34px;
      justify-content: center;
      padding: 0;
    }
    .send {
      background: var(--gold);
      color: var(--ink-on-gold);
      border-color: transparent;
    }
    .send:hover { background: var(--gold-hover); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .chip { padding: 8px 12px; font-size: 13px; }
    .chip.is-on {
      background: var(--gold);
      color: var(--ink-on-gold);
      border-color: transparent;
    }

    .banner {
      width: min(760px, 100%);
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--banner);
      border: 1px solid var(--line);
    }
    .banner h2 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 600;
      color: var(--heading);
    }
    .banner p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    .banner a {
      color: var(--sand);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .banner a:hover { color: var(--gold); }
    .ludix {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-size: 28px;
      color: var(--sand);
    }
    .ludix-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--ink-on-gold);
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0;
      line-height: 1;
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main { padding: 20px 16px 16px; }
      .banner { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          Plan Maestro
        </div>
        <button class="icon-btn" type="button" aria-label="Buscar">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Contraer barra">
          <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>

      <nav class="nav" aria-label="Principal">
        <button class="nav-item active" type="button">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          Nuevo chat
        </button>
        <button class="nav-item" type="button">
          <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.4"/><path d="m20 15-4.5-4.5L6 20"/></svg>
          Imágenes
        </button>
        <button class="nav-item" type="button">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Biblioteca
        </button>
        <button class="nav-item" type="button">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="m3 15 5-4 4 3 3-2 6 4"/></svg>
          Generar Presentaciones
        </button>
        <button class="nav-item" type="button">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="m8 7 4-4 4 4"/><rect x="4" y="14" width="16" height="6" rx="1"/></svg>
          Complementos
        </button>
        <button class="nav-item" type="button">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
          Más herramientas
        </button>
        <button class="nav-item" type="button" id="fullscreen">
          <svg class="ico" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          Pantalla completa
        </button>

        <div class="section">
          Proyectos
          <button type="button" aria-label="Nuevo proyecto">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <button class="row" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>Matemáticas - Conteo</span><em class="count">(1)</em></button>
        <button class="row" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>Proyecto</span><em class="count">(2)</em></button>
        <button class="row" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>Nueva</span><em class="count">(1)</em></button>
        <button class="row" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>Unidades Didácticas</span><em class="count">(1)</em></button>
        <button class="row" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>inglés</span><em class="count">(8)</em></button>
        <button class="row" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>Sala 11 de abril</span><em class="count">(9)</em></button>

        <div class="section">
          Chats
          <button type="button" aria-label="Nuevo chat en la lista">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <button class="row" type="button"><span>Quien eres</span></button>
        <button class="row" type="button"><span>Planificación - Tramo 1 - E…</span></button>
        <button class="row" type="button"><span>1 al 11 - Rughy</span></button>
        <button class="row" type="button"><span>Transcripción de mensaje …</span></button>
        <button class="row" type="button"><span>Context: Transcripción de …</span></button>
      </nav>

      <div class="side-foot">
        <div class="user"><i class="avatar"></i> wild</div>
        <button class="icon-btn theme-btn" type="button" data-theme-set="light" aria-label="Tema claro" aria-pressed="false">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn theme-btn" type="button" data-theme-set="dark" aria-label="Tema oscuro" aria-pressed="true">
          <svg class="ico" viewBox="0 0 24 24"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Salir">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="stage">
        <div class="hero">
          <div class="orb-mount" id="dash-orb"></div>
          <h1>¿En qué te ayudo hoy?</h1>
        </div>

        <section class="composer" aria-label="Nuevo mensaje">
          <label for="crear">¿Qué deseas crear?</label>
          <select class="select" id="crear">
            <option value="">Elige una opción:</option>
            <option>Planificación</option>
            <option>Secuencia</option>
            <option>Rúbrica</option>
            <option>Proyecto</option>
          </select>
          <textarea id="prompt" placeholder="Escribe a Plan MaeŠtrɸ... o arrastrá archivos aquí"></textarea>
          <div class="composer-bar">
            <button class="ghost" type="button">
              <svg class="ico" viewBox="0 0 24 24"><path d="m21.4 11.1-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8.1-8"/></svg>
              Adjuntar
            </button>
            <button class="ghost" type="button" id="reset">
              <svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
              Restablecer
            </button>
            <div class="push">
              <button class="mic" type="button" aria-label="Dictar">
                <svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
              </button>
              <button class="send" type="button" aria-label="Enviar">
                <svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
              </button>
            </div>
          </div>
        </section>

        <div class="chips" id="chips">
          <button class="chip" type="button"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.4"/><path d="m20 15-4.5-4.5L6 20"/></svg>Generar imagen</button>
          <button class="chip" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Chat con documentos</button>
          <button class="chip" type="button"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Agenda</button>
          <button class="chip" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/></svg>Ludix</button>
          <button class="chip" type="button"><svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>Más</button>
        </div>
      </div>

      <aside class="banner">
        <div>
          <h2>Personaliza tu enseñanza con Ludix</h2>
          <p>Juegos y trivias con IA para tus alumnos</p>
          <a href="https://ludix.run">Ir a Ludix</a>
        </div>
        <div class="ludix" aria-label="Ludix"><span class="ludix-mark">OX</span>Ludix</div>
      </aside>
    </main>
  </div>
  <script type="module">
    import { mountLogoMarkOrb } from './assets/js/logo-mark-orb.js';

    const root = document.documentElement;

    function applyTheme(theme) {
      if (theme === 'light') root.dataset.theme = 'light';
      else delete root.dataset.theme;
      document.querySelectorAll('[data-theme-set]').forEach((btn) => {
        btn.setAttribute('aria-pressed', String(btn.getAttribute('data-theme-set') === theme));
      });
    }

    document.querySelectorAll('[data-theme-set]').forEach((btn) => {
      btn.addEventListener('click', () => applyTheme(btn.getAttribute('data-theme-set')));
    });

    if (new URLSearchParams(location.search).get('tema') === 'claro') applyTheme('light');

    mountLogoMarkOrb(document.getElementById('dash-orb'), {
      size: 96,
      label: 'Plan Maestro',
      darkInk: () => root.dataset.theme !== 'light',
    });

    document.querySelectorAll('.nav-item').forEach((item) => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach((other) => other.classList.remove('active'));
        item.classList.add('active');
      });
    });

    document.getElementById('reset').addEventListener('click', () => {
      document.getElementById('crear').value = '';
      document.getElementById('prompt').value = '';
    });

    document.getElementById('chips').addEventListener('click', (event) => {
      const chip = event.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('.chip').forEach((other) => other.classList.remove('is-on'));
      chip.classList.add('is-on');
      document.getElementById('prompt').value = chip.textContent.trim();
    });
  </script>
</body>
</html>
